site_name: tab2seq
site_description: Transform tabular event data into sequences ready for Transformer and Sequential models.
site_url: https://carlomarxdk.github.io/tab2seq
repo_url: https://github.com/carlomarxdk/tab2seq
repo_name: carlomarxdk/tab2seq

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.path
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - toc.follow

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
  - User Guide:
      - Pipeline Overview: guide/pipeline.md
      - Sources: guide/sources.md
      - Cohort & Splits: guide/cohort.md
      - Vocabulary & Tokenizer: guide/vocabulary.md
      - EventDataset: guide/eventdataset.md
      - Record Formats: guide/formats.md
      - Synthetic Data: guide/synthetic.md
  - API Reference: api/

plugins:
  - search
  - gen-files:
      scripts:
        - scripts/gen_docs.py
  - literate-nav:
      nav_file: SUMMARY.md
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
