site_name: tab2seq
repo_url: https://github.com/carlomarxdk/tab2seq


plugins:
- gen-files:
    scripts:
      - scripts/gen_docs.py
- mkdocstrings:
    handlers:
      python:
        options:
          docstring_style: google
          show_source: true
          show_root_heading: true

nav:
  - Home: index.md
  - API reference: api/   